<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="fstGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A192F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B3A5C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="none"/>
  
  <!-- Top border -->
  <rect x="0" y="0" width="1080" height="120" fill="url(#fstGrad)"/>
  
  <!-- Bottom border -->
  <rect x="0" y="960" width="1080" height="120" fill="url(#fstGrad)"/>
  
  <!-- Left border -->
  <rect x="0" y="120" width="40" height="840" fill="url(#fstGrad)"/>
  
  <!-- Right border -->
  <rect x="1040" y="120" width="40" height="840" fill="url(#fstGrad)"/>
  
  <!-- Logo placeholder -->
  <circle cx="80" cy="60" r="35" fill="white" opacity="0.9"/>
  <text x="80" y="65" font-family="Arial, sans-serif" font-size="12" fill="#0A192F" text-anchor="middle" font-weight="bold">IWU</text>
  
  <!-- Top text -->
  <text x="540" y="55" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">FAKULTAS SAINS & TEKNOLOGI</text>
  <text x="540" y="85" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">International Women University</text>
  
  <!-- Bottom text -->
  <text x="540" y="1005" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle" font-weight="bold">PKKMB 2026</text>
  <text x="540" y="1040" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">Fakultas Sains & Teknologi</text>
  
  <!-- Corner accents -->
  <rect x="40" y="120" width="60" height="4" fill="#D4AF37"/>
  <rect x="40" y="956" width="60" height="4" fill="#D4AF37"/>
  <rect x="980" y="120" width="60" height="4" fill="#D4AF37"/>
  <rect x="980" y="956" width="60" height="4" fill="#D4AF37"/>
</svg>